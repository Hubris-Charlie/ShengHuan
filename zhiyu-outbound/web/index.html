<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>智语外呼 · 网页通话台</title>
<style>
  :root { --bg:#0f1419; --panel:#171e26; --line:#243040; --fg:#e6edf3; --dim:#8b98a5;
          --green:#3fb950; --blue:#58a6ff; --amber:#d29922; --red:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .wrap { display:grid; grid-template-columns:340px 1fr; gap:14px; padding:14px; height:100vh; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px;
           display:flex; flex-direction:column; min-height:0; }
  h1 { font-size:15px; margin:0 0 12px; letter-spacing:.5px; }
  h1 span { color:var(--dim); font-weight:400; font-size:12px; }
  button { background:#1f6feb; color:#fff; border:0; border-radius:7px; padding:9px 14px;
           font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button.danger { background:var(--red); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:8px; margin-bottom:10px; }
  .kv { display:flex; justify-content:space-between; font-size:13px; padding:5px 0;
        border-bottom:1px dashed var(--line); }
  .kv b { font-weight:600; }
  .pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px;
          background:#22303f; color:var(--dim); }
  .pill.on { background:rgba(63,185,80,.18); color:var(--green); }
  .pill.warn { background:rgba(210,153,34,.18); color:var(--amber); }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px; }
  .msg { max-width:86%; padding:9px 12px; border-radius:10px; font-size:14px; line-height:1.55;
         white-space:pre-wrap; word-break:break-word; }
  .agent { background:#1c2836; border:1px solid #23374b; align-self:flex-start; }
  .user  { background:#23402a; border:1px solid #2f5a39; align-self:flex-end; }
  .sys   { background:transparent; border:1px dashed var(--line); color:var(--dim);
           font-size:12px; align-self:center; }
  .meta { font-size:11px; color:var(--dim); margin-top:5px; }
  input[type=text] { flex:1; background:#0d1319; border:1px solid var(--line); color:var(--fg);
                     border-radius:7px; padding:9px 11px; font-size:14px; }
  .lat { font-variant-numeric:tabular-nums; font-weight:600; }
  .ok { color:var(--green); } .bad { color:var(--red); } .warnc { color:var(--amber); }
  .hint { font-size:12px; color:var(--dim); line-height:1.6; margin-top:8px; }
  select { background:#0d1319; border:1px solid var(--line); color:var(--fg); border-radius:7px;
           padding:8px 10px; font-size:13px; width:100%; }
  .meter { height:10px; background:#0d1319; border:1px solid var(--line); border-radius:99px;
           overflow:hidden; margin:4px 0 8px; }
  .meter > div { height:100%; width:0%; background:linear-gradient(90deg,#3fb950,#d29922,#f85149);
                 transition:width .05s linear; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>智语外呼 <span>网页通话台</span></h1>

    <div class="row">
      <button id="btn-connect">接通</button>
      <button id="btn-hangup" class="ghost" disabled>挂断</button>
    </div>
    <div class="row">
      <button id="btn-barge" class="ghost" disabled>模拟打断</button>
    </div>

    <div class="kv"><span>链路</span><b><span id="st-link" class="pill">未连接</span></b></div>
    <div class="kv"><span>流程阶段</span><b id="st-state">—</b></div>
    <div class="kv"><span>Agent</span><b><span id="st-agent" class="pill">空闲</span></b></div>
    <div class="kv"><span>首字响应</span><b id="st-lat" class="lat">—</b></div>
    <div class="kv"><span>已播 / 总长</span><b id="st-play" class="lat">—</b></div>
    <div class="kv"><span>合规拦截</span><b id="st-guard">0 次</b></div>

    <div class="kv" style="border-bottom:none;padding-bottom:2px"><span>识别模式</span></div>
    <div class="row">
      <select id="sel-asr">
        <option value="browser">浏览器识别（真实听到你说的话）</option>
        <option value="server">服务端识别（需在 runtime.json 配 ASR）</option>
        <option value="script">脚本台词（演示用，不看你说了什么）</option>
      </select>
    </div>

    <div class="kv" style="border-bottom:none;padding-bottom:2px"><span>麦克风电平</span></div>
    <div class="meter"><div id="meter-fill"></div></div>
    <div class="kv"><span>刚才听到</span><b id="st-heard" style="font-weight:400">—</b></div>

    <div class="row">
      <button id="btn-selfcheck" class="ghost">录 3 秒并回放（自检）</button>
    </div>

    <div class="hint">
      说话直接打断：麦克风检测到持续人声就发打断，并把「真实已播毫秒」上报服务端，
      由服务端按播放进度（而不是生成进度）裁剪出你已经听到的那句话。
    </div>

    <div class="row" style="margin-top:auto">
      <input id="txt" type="text" placeholder="键盘输入（等价于识别结果）" />
      <button id="btn-send" class="ghost" disabled>发送</button>
    </div>
  </div>

  <div class="panel">
    <h1>通话记录 <span id="sid"></span></h1>
    <div id="log"></div>
  </div>
</div>

<script>
const SR = 16000;
const $ = id => document.getElementById(id);
const log = $('log');

let ws = null, ac = null, micStream = null, procNode = null, srcNode = null;
let playQueue = [], currentSrc = null, playing = false, agentSpeaking = false;
let turnPlayedMs = 0, chunkStartCtx = 0, chunkDur = 0, tickTimer = null;
let userSpeaking = false, silenceMs = 0, bargeHoldMs = 0;
let guardCount = 0;
let asrMode = 'browser';           // browser | server | script
let recognition = null, recRunning = false;
let selfCheckRec = null, selfCheckBuf = [];

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

function el(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function sysLine(t) { el('sys', t); }

function setPill(id, text, cls) {
  const e = $(id);
  e.textContent = text;
  e.className = 'pill' + (cls ? ' ' + cls : '');
}

/* ---------------- 音频 ---------------- */
function downsample(input, inRate, outRate) {
  if (inRate === outRate) return input;
  const ratio = inRate / outRate;
  const outLen = Math.floor(input.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const start = Math.floor(i * ratio), end = Math.min(Math.floor((i + 1) * ratio), input.length);
    let sum = 0;
    for (let j = start; j < end; j++) sum += input[j];
    out[i] = sum / Math.max(1, end - start);
  }
  return out;
}
function toInt16(f32) {
  const out = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) {
    const v = Math.max(-1, Math.min(1, f32[i]));
    out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
  }
  return out;
}

async function startMic() {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  // AEC / 降噪 / 自动增益：双讲抗噪的第一道防线
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: false
  });
  srcNode = ac.createMediaStreamSource(micStream);
  procNode = ac.createScriptProcessor(1024, 1, 1);
  procNode.onaudioprocess = e => {
    if (!ws || ws.readyState !== 1) return;
    const f32 = e.inputBuffer.getChannelData(0);
    let sum = 0, peak = 0;
    for (let i = 0; i < f32.length; i++) {
      sum += f32[i] * f32[i];
      const a = Math.abs(f32[i]);
      if (a > peak) peak = a;
    }
    const rms = Math.sqrt(sum / f32.length);
    const frameMs = f32.length / ac.sampleRate * 1000;

    // 电平条：让人一眼看出麦克风到底有没有在收到声音
    const pct = Math.min(100, Math.round(rms * 600));
    $('meter-fill').style.width = pct + '%';

    // 自检录音
    if (selfCheckRec !== null) {
      selfCheckBuf.push(new Float32Array(f32));
      if (++selfCheckRec >= selfCheckTarget) { finishSelfCheck(); }
    }

    if (rms > 0.02) {
      if (!userSpeaking) { userSpeaking = true; silenceMs = 0; ws.send(JSON.stringify({type:'audio_start'})); }
      silenceMs = 0;
      // script / server 模式下才把 PCM 送给服务端做整句识别
      if (asrMode !== 'browser') ws.send(toInt16(downsample(f32, ac.sampleRate, SR)).buffer);

      if (agentSpeaking) {
        bargeHoldMs += frameMs;
        if (bargeHoldMs >= 180) { doBarge(); bargeHoldMs = 0; }
      }
    } else {
      bargeHoldMs = 0;
      if (userSpeaking) {
        silenceMs += frameMs;
        if (silenceMs > 300) {
          userSpeaking = false; silenceMs = 0;
          if (asrMode !== 'browser') ws.send(JSON.stringify({type:'audio_end'}));
        }
      }
    }
  };
  srcNode.connect(procNode);
  procNode.connect(ac.destination);   // 必须连出去，否则某些浏览器不回调
}

/* ---------------- 麦克风自检：录 3 秒并回放 ---------------- */
let selfCheckTarget = 0;

function startSelfCheck() {
  if (!micStream || !ac) { sysLine('先点【接通】，麦克风才会被授权'); return; }
  selfCheckBuf = [];
  const perFrame = 1024;
  selfCheckTarget = Math.ceil(3.0 * ac.sampleRate / perFrame);
  selfCheckRec = 0;
  sysLine('开始录音 3 秒，请正常说话……');
}

function finishSelfCheck() {
  selfCheckRec = null;
  const total = new Float32Array(selfCheckBuf.reduce((n, b) => n + b.length, 0));
  let off = 0;
  for (const b of selfCheckBuf) { total.set(b, off); off += b.length; }
  selfCheckBuf = [];
  let peak = 0, sum = 0;
  for (let i = 0; i < total.length; i++) { const a = Math.abs(total[i]); if (a > peak) peak = a; sum += total[i]*total[i]; }
  const rms = Math.sqrt(sum / total.length);
  const buf = ac.createBuffer(1, total.length, ac.sampleRate);
  buf.copyToChannel(total, 0);
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
  const verdict = peak < 0.01 ? '⚠ 几乎没录到声音：检查输入设备、系统音量、麦克风是否被静音'
                : peak < 0.05 ? '⚠ 声音偏小：把系统输入音量调大一点'
                : '✅ 麦克风工作正常';
  sysLine(`自检结果：峰值 ${peak.toFixed(3)}，均方根 ${rms.toFixed(3)} → ${verdict}（正在回放刚才 3 秒）`);
}

/* ---------------- 浏览器实时识别（Web Speech API） ---------------- */
function startRecognition() {
  if (!SpeechRec) {
    sysLine('⚠ 当前浏览器不支持语音识别（需要 Chrome / Edge），已切到服务端识别模式');
    $('sel-asr').value = 'server';
    asrMode = 'server';
    return;
  }
  if (recRunning) return;
  recognition = new SpeechRec();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = ev => {
    let interim = '', final = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    $('st-heard').textContent = (final || interim || '—').slice(-40);
    // Agent 正在说话时收到的是它自己的声音，丢弃，避免自问自答
    if (final.trim() && !agentSpeaking && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({type:'user_text', text: final.trim()}));
      $('st-heard').textContent = '—';
    }
  };
  recognition.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      sysLine('⚠ 浏览器拒绝语音识别权限：请允许麦克风，或改用服务端识别模式');
    } else if (ev.error !== 'no-speech' && ev.error !== 'aborted') {
      sysLine('识别提示：' + ev.error);
    }
  };
  recognition.onend = () => {
    recRunning = false;
    if (asrMode === 'browser' && ws && ws.readyState === 1) setTimeout(startRecognition, 250);
  };
  try { recognition.start(); recRunning = true; sysLine('已开启浏览器实时识别（普通话）'); }
  catch (e) { sysLine('识别启动失败：' + e.message); }
}

function stopRecognition() {
  recRunning = false;
  if (recognition) { try { recognition.abort(); } catch (e) {} recognition = null; }
}

function applyAsrMode(mode) {
  asrMode = mode;
  if (mode === 'browser') startRecognition();
  else { stopRecognition(); sysLine(mode === 'server' ? '已切到服务端识别（需要 runtime.json 配好 ASR）'
                                                     : '已切到脚本台词模式（演示用，不看你说了什么）'); }
}

/* ---------------- 播放与已播记账 ---------------- */
function enqueue(int16) {
  if (!ac) return;
  const f32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) f32[i] = int16[i] / 32768;
  const buf = ac.createBuffer(1, f32.length, SR);
  buf.copyToChannel(f32, 0);
  playQueue.push(buf);
  if (!playing) playNext();
}

function playNext() {
  const buf = playQueue.shift();
  if (!buf) {
    playing = false; agentSpeaking = false; currentSrc = null;
    setPill('st-agent', '空闲', '');
    return;
  }
  playing = true; agentSpeaking = true;
  setPill('st-agent', '说话中', 'on');
  currentSrc = ac.createBufferSource();
  currentSrc.buffer = buf;
  currentSrc.connect(ac.destination);
  chunkStartCtx = ac.currentTime;
  chunkDur = buf.duration * 1000;
  currentSrc.onended = () => {
    if (!agentSpeaking) return;         // 已被打断
    clearInterval(tickTimer);
    turnPlayedMs += chunkDur;
    showPlay(turnPlayedMs);
    playNext();
  };
  currentSrc.start();
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    const ms = turnPlayedMs + Math.min(chunkDur, (ac.currentTime - chunkStartCtx) * 1000);
    showPlay(ms);
  }, 60);
}

function showPlay(ms) {
  $('st-play').textContent = Math.round(ms) + ' ms';
}

function stopPlayback() {
  agentSpeaking = false;
  playing = false;
  playQueue = [];
  clearInterval(tickTimer);
  if (currentSrc) { try { currentSrc.stop(); } catch (e) {} currentSrc = null; }
  setPill('st-agent', '空闲', '');
}

function currentPlayedMs() {
  if (!agentSpeaking) return 0;
  return turnPlayedMs + Math.min(chunkDur, Math.max(0, (ac.currentTime - chunkStartCtx) * 1000));
}

function doBarge() {
  const played = Math.round(currentPlayedMs());
  stopPlayback();
  turnPlayedMs = 0;
  sysLine('⏹ 本地已停播，上报已播 ' + played + ' ms');
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'barge_in', played_ms: played}));
}

/* ---------------- 连接 ---------------- */
function connect() {
  const q = new URLSearchParams(location.search);
  const port = q.get('ws') || '8765';
  const url = 'ws://' + location.hostname + ':' + port;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    setPill('st-link', '已连接', 'on');
    $('btn-connect').disabled = true;
    $('btn-hangup').disabled = false;
    $('btn-barge').disabled = false;
    $('btn-send').disabled = false;
    await startMic();
    applyAsrMode($('sel-asr').value);
  };

  ws.onmessage = ev => {
    if (ev.data instanceof ArrayBuffer) {
      enqueue(new Int16Array(ev.data));
      return;
    }
    const m = JSON.parse(ev.data);
    if (m.type === 'ready') {
      $('sid').textContent = 'session ' + m.session;
      sysLine('通话已接通（服务端 session ' + m.session + '，ASR 模式 ' + m.asr + '）');
    } else if (m.type === 'asr') {
      el('user', m.text);
      $('st-heard').textContent = m.text.slice(-40);
    } else if (m.type === 'notice') {
      sysLine('ℹ ' + m.message);
    } else if (m.type === 'agent') {
      turnPlayedMs = 0;
      const d = el('agent', m.text);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '阶段 ' + m.state + ' · 音频 ' + Math.round(m.audio_ms) + ' ms'
        + (m.fallback ? ' · 已用兜底话术' : '') + (m.guard ? ' · 命中禁语 ' + m.guard : '');
      d.appendChild(meta);
      $('st-state').textContent = m.state;
      if (m.guard) { guardCount++; $('st-guard').textContent = guardCount + ' 次'; }
    } else if (m.type === 'user') {
      el('user', m.text);
    } else if (m.type === 'latency') {
      $('st-lat').textContent = Math.round(m.first_response_ms) + ' ms';
      $('st-lat').className = 'lat ' + (m.first_response_ms <= 2000 ? 'ok' : 'bad');
      sysLine('时延：首字 ' + Math.round(m.first_response_ms) + 'ms ｜ LLM 首token '
              + Math.round(m.llm_ttft_ms) + 'ms ｜ TTS 首包 ' + Math.round(m.tts_ttfb_ms) + 'ms');
    } else if (m.type === 'barge') {
      $('st-guard').textContent = guardCount + ' 次';
      sysLine('打断生效：生成 ' + Math.round(m.generated_ms) + 'ms，实播 ' + Math.round(m.played_ms)
              + 'ms\n已听到：「' + m.spoken_prefix + '」\n未播出：「' + (m.unspoken || '') + '」');
    } else if (m.type === 'end') {
      sysLine('通话结束，state=' + m.state + '，闭环=' + m.closed
              + '，回写=' + (m.writeback ? m.writeback.ticket_id : '无')
              + '，必说话术缺失=' + JSON.stringify(m.compliance.mandatory_missing));
      disconnect();
    } else if (m.type === 'error') {
      sysLine('错误：' + m.message);
    }
  };

  ws.onclose = () => {
    setPill('st-link', '已断开', 'warn');
    $('btn-connect').disabled = false;
    $('btn-hangup').disabled = true;
    $('btn-barge').disabled = true;
    $('btn-send').disabled = true;
    stopRecognition();
  };
}

function disconnect() {
  stopRecognition();
  stopPlayback();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type:'hangup'}));
  setTimeout(() => { if (ws) { ws.close(); ws = null; } }, 60);
  if (procNode) { try { procNode.disconnect(); } catch (e) {} procNode = null; }
  if (srcNode) { try { srcNode.disconnect(); } catch (e) {} srcNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

$('btn-connect').onclick = connect;
$('btn-hangup').onclick = disconnect;
$('btn-barge').onclick = () => { doBarge(); };
$('btn-selfcheck').onclick = () => { startSelfCheck(); };
$('sel-asr').onchange = e => { if (ws && ws.readyState === 1) applyAsrMode(e.target.value); };
$('btn-send').onclick = () => {
  const v = $('txt').value.trim();
  if (!v || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({type:'user_text', text:v}));
  $('txt').value = '';
};
$('txt').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-send').click(); });

if (!SpeechRec) {
  sysLine('⚠ 这个浏览器不支持语音识别，请在 chrome://extensions 之外的 Chrome/Edge 打开；已默认切到服务端识别');
  $('sel-asr').value = 'server';
}
sysLine('先点【接通】。默认用浏览器实时识别，你说话会被转成文字发出去；点【录 3 秒并回放】可自检麦克风。');
</script>
</body>
</html>
